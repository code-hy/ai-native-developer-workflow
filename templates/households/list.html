{% extends "base.html" %}
{% block title %}Households{% endblock %}
{% block content %}
<div class="flex justify-between items-center">
  <h1 class="text-lg font-semibold">Your households</h1>
  <a href="{% url 'households:create' %}" class="bg-teal-600 text-white px-4 py-2 rounded-md text-sm">New household</a>
</div>
<div class="mt-4 grid gap-4">
  {% for h in households %}
  <a href="{% url 'households:detail' h.pk %}" class="bg-white border border-slate-200 rounded-lg p-4 hover:shadow-sm">
    <div class="font-medium">{{ h.name }}</div>
    <div class="text-sm text-slate-600">{{ h.get_type_display }} • {{ h.timezone }}</div>
  </a>
  {% empty %}
  <div class="bg-white border border-slate-200 rounded-lg p-6 text-center">
    <p class="text-sm text-slate-600">No households yet.</p>
    <a href="{% url 'households:create' %}" class="text-teal-700 text-sm hover:underline mt-2 inline-block">Create one</a>
  </div>
  {% endfor %}
</div>
{% endblock %}
