{% extends "base.html" %}
{% block title %}Password reset{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white border p-6 rounded-lg">
  <h1 class="font-semibold">Password reset</h1>
  <p class="text-sm text-slate-600">Enter your email to receive a reset link.</p>
  <form method="post" class="mt-4 space-y-3">{% csrf_token %}{{ form.as_p }}<button class="bg-teal-600 text-white px-4 py-2 rounded-md">Send link</button></form>
</div>
{% endblock %}
