[project]
name = "household"
version = "0.1.0"
description = "Household Chores Manager — Django + HTMX"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Django==5.2.8",
  "psycopg[binary]==3.2.9",
  "gunicorn==22.0.0",
  "whitenoise==6.8.2",
  "django-htmx==1.19.0",
  "django-widget-tweaks==1.5.0",
  "django-q2==1.6.1",
  "python-dateutil==2.9.0.post0",
  "pytz==2024.2",
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
  "pytest-django==4.9.0",
  "factory-boy==3.3.1",
  "pytest-cov==6.0.0",
  "time-machine==2.15.0",
  "ruff==0.9.6",
  "mypy==1.13.0",
  "django-stubs==5.1.3",
  "playwright==1.49.0",
]

[tool.uv]
managed = true
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
lint.select = ["E","F","I","B","UP","W"]
lint.ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations", "tests/e2e"]

[tool.django-stubs]
django_settings_module = "core.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = ["e2e: end-to-end tests", "unit: unit tests", "integration: integration tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["household", "core", "accounts", "chores", "groceries", "bills", "maintenance", "activity"]
omit = ["*/migrations/*", "*/tests/*", "*/test_*.py", "manage.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
